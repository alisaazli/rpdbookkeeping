<style>
:root{--bg:#f7f6fa;--surface:#fff;--surface2:#f0edf7;--ink:#292635;--muted:#777183;--line:#e7e3ee;--primary:#7254b5;--primary2:#5d429c;--accent:#b49aff;--good:#23865b;--bad:#d85d75;--warn:#9a6b22;--shadow:0 8px 26px #2926350d}
[data-theme="dark"]{--bg:#191923;--surface:#242331;--surface2:#302d40;--ink:#f0edf7;--muted:#aaa4b8;--line:#3b374a;--primary:#b49aff;--primary2:#9b7be8;--accent:#b49aff;--good:#65c99b;--bad:#ff8d9b;--warn:#e6bc70;--shadow:0 8px 26px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1600px;margin:auto;min-height:100vh}.topbar{height:72px;background:#191923;color:#f0edf7;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;position:sticky;top:0;z-index:5}.brand{display:flex;gap:12px;align-items:center}.brandmark{width:42px;height:42px;border-radius:13px;background:#302d40;color:#b49aff;display:grid;place-items:center;font-size:22px}.brand h1{font-size:16px;margin:0}.brand p{margin:1px 0 0;color:#bdb6ca;font-size:10px;letter-spacing:1.3px}.top-actions{display:flex;gap:8px;align-items:center}.layout{display:grid;grid-template-columns:238px 1fr;min-height:calc(100vh - 72px)}aside{padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}.nav-label{font-size:10px;color:var(--muted);letter-spacing:1.3px;font-weight:800;padding:13px 12px 6px}.navbtn{width:100%;display:flex;align-items:center;gap:11px;border:0;border-radius:10px;padding:11px 12px;margin:3px 0;background:transparent;color:var(--muted);text-align:left}.navbtn:hover,.navbtn.active{background:var(--surface2);color:var(--primary);font-weight:750}.navbtn .ico{width:20px;text-align:center;font-size:17px}main{padding:26px;min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.pagehead h2{margin:0;font-size:25px;letter-spacing:-.6px}.pagehead p{margin:5px 0 0;color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:var(--surface);color:var(--ink);font-weight:650;display:inline-flex;align-items:center;gap:7px}.btn.primary{background:var(--primary);border-color:var(--primary);color:white}.btn.soft{background:var(--surface2);color:var(--primary);border-color:transparent}.btn.danger{color:var(--bad)}.btn.sm{padding:6px 9px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:17px}.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.metric{padding:16px}.metric .label{font-size:12px;color:var(--muted)}.metric .value{font-size:23px;font-weight:800;margin-top:6px;overflow-wrap:anywhere}.metric .hint{font-size:11px;color:var(--muted);margin-top:4px}.metric .symbol{float:right;color:var(--primary);font-size:20px}.panel{padding:18px;margin-bottom:16px}.panel h3{font-size:15px;margin:0 0 13px}.split{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}.field label{font-size:12px;color:var(--muted);font-weight:750}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--surface);color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus,.toolbar select:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 15%,transparent)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}.full{grid-column:1/-1}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:13px}.toolbar>*{flex:1;min-width:130px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;background:var(--surface2)}td,th{padding:11px 9px;border-bottom:1px solid var(--line)}td.amount{text-align:right;font-weight:750;font-variant-numeric:tabular-nums}.pill{display:inline-block;border-radius:30px;padding:4px 8px;font-size:10px;font-weight:800;background:var(--surface2);color:var(--primary)}.pill.in{background:#e6f5ed;color:#23734c}.pill.out{background:#fff0f1;color:#b84960}.pill.pending{background:#fff5df;color:#93651b}.pill.draft{background:var(--surface2);color:var(--muted)}.muted{color:var(--muted)}.empty{text-align:center;padding:30px;color:var(--muted)}.barrow{margin:13px 0}.barlabel{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;gap:8px}.bartrack{height:8px;border-radius:20px;background:var(--surface2);overflow:hidden}.barfill{height:100%;background:var(--primary);border-radius:20px}.notice{padding:11px 13px;background:var(--surface2);border-radius:10px;color:var(--muted);font-size:12px;margin:8px 0 14px}.notice.warn{background:#fff5df;color:#805c22}.notice.good{background:#e7f5ed;color:#276846}.modalback{display:none;position:fixed;inset:0;background:#11111bbb;z-index:20;align-items:center;justify-content:center;padding:14px}.modalback.show{display:flex}.modal{width:min(720px,100%);max-height:94vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modalhead h3{margin:0}.close{border:0;border-radius:50%;width:32px;height:32px;background:var(--surface2);color:var(--ink);font-size:20px}.actions{display:flex;gap:6px;flex-wrap:wrap}.receiptthumb{width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.mobilebar{display:none}.footer{text-align:center;color:var(--muted);font-size:10px;padding:14px}.smalltext{font-size:11px;color:var(--muted)}.chart{display:flex;align-items:end;gap:8px;height:150px;padding:10px 3px 0}.chartcol{flex:1;min-width:0;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:end;gap:5px}.chartbars{height:112px;display:flex;align-items:end;justify-content:center;gap:3px}.chartbar{width:35%;max-width:18px;border-radius:5px 5px 0 0;background:var(--primary)}.chartbar.exp{background:var(--bad)}.chartlabel{font-size:9px;color:var(--muted)}.catrow{display:flex;align-items:center;gap:8px}.catrow .name{flex:1}.badgecount{font-size:10px;background:var(--surface2);border-radius:20px;padding:3px 7px;color:var(--muted)}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}main{padding:18px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:8;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}.mobilebar .navbtn{width:auto;display:flex;flex-direction:column;gap:1px;padding:5px 7px;margin:0;font-size:9px}.mobilebar .navbtn .ico{font-size:18px}.app{padding-bottom:70px}.topbar{padding:10px 15px;height:64px}.top-actions .btn span{display:none}}
@media(max-width:600px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{padding:12px}.metric .value{font-size:18px}.split,.grid2{grid-template-columns:1fr}.pagehead h2{font-size:21px}.panel{padding:14px}.brand h1{font-size:14px}.brand p{font-size:9px}.topbar .btn{padding:8px}.toolbar>*{min-width:110px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="brandmark">⌂</div><div><h1>RPD Bookkeeping</h1><p>RUMAH PENJAGAAN DAMAI</p></div></div><div class="top-actions"><button class="btn" id="themeBtn">◐ <span>Theme</span></button><button class="btn" id="backupBtn">⇩ <span>Backup</span></button></div></header>
<div class="layout">
<aside><div class="nav-label">WORKSPACE</div><button class="navbtn active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button><button class="navbtn" data-page="add"><span class="ico">＋</span>Add Transaction</button><button class="navbtn" data-page="history"><span class="ico">▤</span>Transaction History</button><button class="navbtn" data-page="approvals"><span class="ico">◷</span>Approvals <span id="approvalCount" class="badgecount"></span></button><button class="navbtn" data-page="drafts"><span class="ico">▧</span>Drafts</button><div class="nav-label">MANAGEMENT</div><button class="navbtn" data-page="categories"><span class="ico">◇</span>Categories</button><button class="navbtn" data-page="rules"><span class="ico">⌁</span>Learning Rules</button><button class="navbtn" data-page="reports"><span class="ico">▥</span>Reports</button><button class="navbtn" data-page="trash"><span class="ico">♲</span>Trash</button><button class="navbtn" data-page="audit"><span class="ico">≡</span>Audit Trail</button><button class="navbtn" data-page="settings"><span class="ico">⚙</span>Settings</button></aside>
<main id="main"></main>
</div>
<nav class="mobilebar"><button class="navbtn active" data-page="dashboard"><span class="ico">▦</span>Home</button><button class="navbtn" data-page="history"><span class="ico">▤</span>History</button><button class="navbtn" data-page="add"><span class="ico">＋</span>Add</button><button class="navbtn" data-page="reports"><span class="ico">▥</span>Reports</button><button class="navbtn" data-page="settings"><span class="ico">⚙</span>Settings</button></nav>
<div class="footer">RPD Bookkeeping · Prototype build · Data storage mode is shown in Settings</div></div>
<div class="modalback" id="modalBack"><div class="modal"><div class="modalhead"><h3 id="modalTitle">Details</h3><button class="close" id="modalClose">×</button></div><div id="modalBody"></div></div></div>
<script>
const DEFAULT_OUT=[
["STOK BAHAN KERING",["rokok","tong gas","SNS ali","biskut / kicap","makan pt (appt klinik/hosp)"]],
["STOK BAHAN BASAH",["pasar borong","bunga kantan","ayam mentah"]],
["RAWATAN PELATIH",["ubatan pt","makan pt (emergency)"]],
["BIL TELEFON",["bos & admin 013","admin 019","suhaimi/pt"]],
["GAJI PENGURUSAN",["azli","ghazali","radzai","rohaiza"]],
["GAJI PENTADBIRAN",["adam","uden","suhaimi","hadzrin","alisa"]],
["GAJI PEGAWAI SOKONGAN (SYIF)",["yazid","ijam"]],
["GAJI PEGAWAI SOKONGAN (DAPUR & PENGURUSAN)",["adif","sudin","pembantu admin"]],
["IMBUHAN JATI DIRI",["elaun mingguan pt","elaun malam pt","elaun kelas pt"]],
["LAIN-LAIN",["barang checkers","upah selenggara vending"]],
["REFUND (DISCAJ)",["refund deposit"]],
["REFUND (YURAN ZAKAT)",["return yuran pemohon zakat"]],
["KOMISEN",["komisen pt baru"]],
["KENDERAAN & PENGANGKUTAN",["transport fee","petrol / diesel","roadtax & insurans","servis kenderaan"]],
["KERAIAN",["hadiah / saguhati harijadi pt"]],
["KEBERSIHAN PT",["berus gigi","ubat gigi","deodorant","penyepit kuku","sarung tangan"]],
["BIL UTILITI",["eletrik","air","astro"]],
["PELBAGAI",["racun tikus / semut / rumput","gergaji","bateri pam racun","pinggan","kepala paip","kepala gas","kuali","sudu / senduk","mop"]],
["KEPERLUAN PEJABAT",["alat tulis","fail","ink cartridge","a4 paper"]],
["REPAIR & MAINTENANCE",[]],
["WELFARE (program dll)",["meeting","majlis","pelawat MAIS"]]
];
const DEFAULT_IN=["YURAN PELATIH","DEPOSIT","SUMBANGAN","LAIN-LAIN PENDAPATAN"];
const KEY="rpd_bookkeeping_v2";
const today=()=>{let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const monthNow=()=>today().slice(0,7), uid=()=>crypto.randomUUID?crypto.randomUUID():"id-"+Date.now()+"-"+Math.random().toString(36).slice(2);
const money=n=>"RM "+Number(n||0).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let state=loadState(),page="dashboard",deferredInstall=null,editingId=null,receiptDrafts=[];
function loadState(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.transactions)){s.categories||=DEFAULT_OUT.map(([name,subs],order)=>({id:uid(),name,subs,archived:false,order}));s.incomeCategories||=DEFAULT_IN.map((name,order)=>({id:uid(),name,subs:[],archived:false,order}));s.drafts||=[];s.trash||=[];s.rules||=[];s.audit||=[];s.proposedChanges||=[];s.openingBalances||={"2026-01":0};s.settings||={theme:"light",role:"Owner",ownerName:"Owner",retentionYears:5};return s}}catch(e){}return {transactions:[],drafts:[],trash:[],proposedChanges:[],categories:DEFAULT_OUT.map(([name,subs],order)=>({id:uid(),name,subs,archived:false,order})),incomeCategories:DEFAULT_IN.map((name,order)=>({id:uid(),name,subs:[],archived:false,order})),rules:[],audit:[],openingBalances:{"2026-01":0},settings:{theme:"light",role:"Owner",ownerName:"Owner",retentionYears:5}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));updateCounts()}
function log(action,record,details=""){state.audit.unshift({id:uid(),at:new Date().toISOString(),user:state.settings.ownerName||"Owner",action,record,details});save()}
function updateCounts(){let el=document.getElementById("approvalCount");if(el)el.textContent=state.transactions.filter(t=>t.status==="pending").length||""}
function activeCats(type){return (type==="in"?state.incomeCategories:state.categories).filter(c=>!c.archived).sort((a,b)=>a.order-b.order)}
function allCategoryNames(){return [...state.categories,...state.incomeCategories].map(c=>c.name)}
function openingFor(month){let explicit=state.openingBalances[month];if(explicit!==undefined)return Number(explicit);let d=new Date(month+"-01T00:00:00");d.setMonth(d.getMonth()-1);let prev=d.toISOString().slice(0,7);return closingFor(prev)}
function sumType(type,arr=state.transactions){return arr.filter(t=>t.type===type&&t.status==="posted"&&!t.deletedAt).reduce((a,t)=>a+Number(t.amount),0)}
function closingFor(month){let arr=state.transactions.filter(t=>t.status==="posted"&&!t.deletedAt&&t.date.startsWith(month));return openingForNoRecursion(month)+sumType("in",arr)-sumType("out",arr)}
function openingForNoRecursion(month){if(state.openingBalances[month]!==undefined)return Number(state.openingBalances[month]);let d=new Date(month+"-01T00:00:00");d.setMonth(d.getMonth()-1);let prev=d.toISOString().slice(0,7);return closingFor(prev)}
function visiblePosted(){return state.transactions.filter(t=>t.status==="posted"&&!t.deletedAt)}
function categoryFor(detail,type){let d=String(detail||"").toLowerCase();let cats=activeCats(type);let rules=state.rules.filter(r=>r.type===type);let hit=rules.filter(r=>d.includes(r.phrase.toLowerCase())).sort((a,b)=>b.phrase.length-a.phrase.length)[0];if(hit&&cats.some(c=>c.id===hit.categoryId))return hit.categoryId;let best=null;for(let c of cats){let terms=[c.name,...(c.subs||[])];for(let term of terms){let t=term.toLowerCase();if(t.length>2&&d.includes(t)&&(!best||t.length>best.len))best={id:c.id,len:t.length}}}return best?.id||""}
function categoryObj(id,type){return (type==="in"?state.incomeCategories:state.categories).find(c=>c.id===id)}
function rememberRule(t){let phrase=t.details.trim().toLowerCase();if(phrase.length<3||!t.categoryId)return;let existing=state.rules.find(r=>r.type===t.type&&r.phrase===phrase);if(existing){existing.categoryId=t.categoryId;existing.updatedAt=new Date().toISOString()}else state.rules.push({id:uid(),phrase,type:t.type,categoryId:t.categoryId,createdAt:new Date().toISOString()});}
function rulesPage(){return `${header("Learning Rules","Rules learned from category choices. Suggestions still require confirmation.")}<div class="panel"><div class="notice">When you confirm a category for a transaction, the description is saved as a matching phrase. Similar descriptions containing that phrase may receive the same suggestion. This is rule-based learning, not an AI model.</div>${state.rules.length?`<div class="tablewrap"><table><tr><th>Phrase</th><th>Type</th><th>Suggested category</th><th>Action</th></tr>${state.rules.map(r=>`<tr><td>${esc(r.phrase)}</td><td>${r.type==="in"?"Cash In":"Cash Out"}</td><td>${esc(categoryObj(r.categoryId,r.type)?.name||"Archived / missing")}</td><td><button class="btn sm" onclick="editRule('${r.id}')">Edit</button> <button class="btn sm danger" onclick="deleteRule('${r.id}')">Delete</button></td></tr>`).join("")}</table></div>`:`<div class="empty">No learning rules yet. Rules are created when you save a transaction with a confirmed category.</div>`}</div>`}
function editRule(id){let r=state.rules.find(x=>x.id===id);if(!r)return;let cats=activeCats(r.type);openModal("Edit learning rule",`<div class="field"><label>Matching phrase</label><input id="rulePhrase" value="${esc(r.phrase)}"></div><div class="field"><label>Category</label><select id="ruleCat">${cats.map(c=>`<option value="${c.id}" ${c.id===r.categoryId?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div><button class="btn primary" onclick="saveRule('${id}')">Save rule</button>`)}
function saveRule(id){let r=state.rules.find(x=>x.id===id),phrase=document.getElementById("rulePhrase").value.trim().toLowerCase(),cat=document.getElementById("ruleCat").value;if(!phrase||!cat)return alert("Phrase and category are required.");r.phrase=phrase;r.categoryId=cat;log("LEARNING_RULE_UPDATED",id,phrase);document.getElementById("modalBack").classList.remove("show");render()}
function deleteRule(id){if(!confirm("Delete this learning rule?"))return;state.rules=state.rules.filter(r=>r.id!==id);log("LEARNING_RULE_DELETED",id);render()}
function showPage(p){page=p;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>showPage(b.dataset.page)));
function header(title,desc,action=""){return `<div class="pagehead"><div><h2>${title}</h2><p>${desc}</p></div>${action}</div>`}
function metric(label,value,symbol,hint){return `<div class="card metric"><span class="symbol">${symbol}</span><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint}</div></div>`}
function rangeMonth(){return document.getElementById("dashMonth")?.value||monthNow()}
function dashboard(){let mon=rangeMonth(),arr=visiblePosted().filter(t=>t.date.startsWith(mon)),inc=arr.filter(t=>t.type==="in").reduce((a,t)=>a+t.amount,0),out=arr.filter(t=>t.type==="out").reduce((a,t)=>a+t.amount,0),open=openingFor(mon),close=open+inc-out,by={};arr.filter(t=>t.type==="out").forEach(t=>{let c=categoryObj(t.categoryId,"out");let n=c?.name||t.categoryName||"Uncategorised";by[n]=(by[n]||0)+t.amount});let sorted=Object.entries(by).sort((a,b)=>b[1]-a[1]),max=sorted[0]?.[1]||1;let prev=new Date(mon+"-01T00:00:00");prev.setMonth(prev.getMonth()-1);let pm=prev.toISOString().slice(0,7),pa=visiblePosted().filter(t=>t.date.startsWith(pm)),po=pa.filter(t=>t.type==="out").reduce((a,t)=>a+t.amount,0);let recent=arr.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);return `${header("Dashboard","Ringkasan kewangan Rumah Penjagaan Damai",`<div class="actions"><input aria-label="Month" type="month" id="dashMonth" value="${mon}" style="border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--surface);color:var(--ink)"><button class="btn primary" onclick="showPage('add')">＋ Add Transaction</button></div>`)}
<div class="cards">${metric("Opening Balance",money(open),"◉","Bank balance awal bulan")}${metric("Total Cash In",money(inc),"↗","Bulan dipilih")}${metric("Total Cash Out",money(out),"↘","Bulan dipilih")}${metric("Closing Balance",money(close),"▣","Baki akhir bulan")}</div>
<div class="split"><section class="panel"><h3>Expenses by Category</h3>${sorted.length?sorted.map(([c,v])=>`<div class="barrow"><div class="barlabel"><a href="#" onclick="event.preventDefault();showPage('history');setTimeout(()=>{document.getElementById('catFilter').value='${esc(c)}';filterHistory()},0)" style="color:var(--primary)">${esc(c)}</a><b>${money(v)}</b></div><div class="bartrack"><div class="barfill" style="width:${v/max*100}%"></div></div></div>`).join(""):`<div class="empty">Belum ada rekod cash out untuk bulan ini.</div>`}</section>
<section class="panel"><h3>Monthly Cash Flow</h3>${cashflowChart(mon)}<div class="smalltext">Current month vs previous month expenses: ${money(po)} previous month.</div></section></div>
<div class="split"><section class="panel"><h3>Recent Transactions</h3>${recent.length?recent.map(t=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)"><div><b>${esc(t.details)}</b><div class="smalltext">${t.date} · ${esc(categoryObj(t.categoryId,t.type)?.name||t.categoryName||"")}</div></div><b style="color:${t.type==="in"?"var(--good)":"var(--bad)"}">${t.type==="in"?"+":"−"}${money(t.amount)}</b></div>`).join(""):`<div class="empty">No posted transactions yet.</div>`}<button class="btn sm" onclick="showPage('history')">View history →</button></section>
<section class="panel"><h3>Quick Actions</h3><div class="actions">${["add","history","reports","categories","drafts","approvals"].map((p,i)=>`<button class="btn soft" onclick="showPage('${p}')">${["＋ Add Transaction","▤ History","▥ Reports","◇ Categories","▧ Drafts","◷ Approvals"][i]}</button>`).join("")}</div><div class="notice" style="margin-top:14px">Pending approvals: <b>${state.transactions.filter(t=>t.status==="pending").length}</b></div></section></div>
<section class="panel"><div class="pagehead"><div><h3 style="margin:0">Annual Overview · ${mon.slice(0,4)}</h3><p>Monthly Cash In and Cash Out</p></div></div>${annualChart(mon.slice(0,4))}</section>`}
function cashflowChart(mon){let y=Number(mon.slice(0,4)),m=Number(mon.slice(5));let prev=new Date(y,m-2,1),months=[];for(let i=5;i>=0;i--){let d=new Date(y,m-1-i,1),key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");months.push(key)}let vals=months.map(k=>{let a=visiblePosted().filter(t=>t.date.startsWith(k));return {k,inc:a.filter(t=>t.type==="in").reduce((s,t)=>s+t.amount,0),out:a.filter(t=>t.type==="out").reduce((s,t)=>s+t.amount,0)}});let max=Math.max(1,...vals.flatMap(v=>[v.inc,v.out]));return `<div class="chart">${vals.map(v=>`<div class="chartcol"><div class="chartbars"><div class="chartbar" style="height:${v.inc/max*100}%"></div><div class="chartbar exp" style="height:${v.out/max*100}%"></div></div><div class="chartlabel">${v.k.slice(5)}</div></div>`).join("")}</div><div class="smalltext">🟣 Cash In · <span style="color:var(--bad)">■</span> Cash Out</div>`}
function annualChart(year){let vals=Array.from({length:12},(_,i)=>{let k=year+"-"+String(i+1).padStart(2,"0"),a=visiblePosted().filter(t=>t.date.startsWith(k));return {k,inc:a.filter(t=>t.type==="in").reduce((s,t)=>s+t.amount,0),out:a.filter(t=>t.type==="out").reduce((s,t)=>s+t.amount,0)}}),max=Math.max(1,...vals.flatMap(v=>[v.inc,v.out]));return `<div class="chart">${vals.map(v=>`<div class="chartcol"><div class="chartbars"><div class="chartbar" style="height:${v.inc/max*100}%"></div><div class="chartbar exp" style="height:${v.out/max*100}%"></div></div><div class="chartlabel">${v.k.slice(5)}</div></div>`).join("")}</div>`}
function txForm(t={},draft=false){let typ=t.type||"out",cat=categoryObj(t.categoryId,typ);return `<form id="txForm" onsubmit="submitTx(event,'${t.id||""}',${draft})"><div class="grid2"><div class="field"><label>Transaction Type *</label><select id="txType" required onchange="refreshCategoryOptions()"><option value="out" ${typ==="out"?"selected":""}>Cash Out</option><option value="in" ${typ==="in"?"selected":""}>Cash In</option></select></div><div class="field"><label>Date *</label><input id="txDate" type="date" required value="${t.date||today()}"></div><div class="field full"><label>Description / Details *</label><input id="txDetails" required value="${esc(t.details||"")}" placeholder="Contoh: Tembikai, bil elektrik, yuran pelatih" oninput="suggestCategory()"></div><div class="field"><label>Category *</label><select id="txCategory" required onchange="showSubcategories()"></select><div id="aiHint" class="smalltext">Category suggestion uses your active categories and learning rules.</div></div><div class="field"><label>Subcategory (optional)</label><select id="txSub"><option value="">— None —</option></select></div><div class="field"><label>Amount (RM) *</label><input id="txAmount" type="number" min="0.01" step="0.01" required value="${t.amount??""}" placeholder="0.00"></div><div class="field"><label>Receipt files (optional, multiple)</label><input id="txFiles" type="file" accept="image/*,application/pdf" multiple capture="environment"><div class="smalltext">Camera, Photos or Files. OCR suggestions require verification.</div></div><div class="field full" id="receiptPreviews">${(t.receipts||[]).map((r,i)=>`<div class="actions"><span>${esc(r.name||"Receipt "+(i+1))}</span><button type="button" class="btn sm" onclick="previewExistingReceipt('${t.id||""}',${i})">Preview</button></div>`).join("")}</div><div class="field full"><div class="notice" id="ocrHint">Select receipt images to scan and review extracted text.</div></div></div><div class="actions" style="justify-content:flex-end"><button type="button" class="btn" onclick="saveAsDraft('${t.id||""}')">Save Draft</button><button class="btn primary" type="submit">${draft?"Save Draft":"Submit Transaction"}</button></div></form>`}
function addPage(){return `${header("Add Transaction","Every transaction requires an active category.")}<div class="panel" style="max-width:850px"><div class="notice">Category suggestions use dynamic category/subcategory matching and your saved learning rules. Confirm the category before submitting.</div>${txForm()}</div>`}
function refreshCategoryOptions(){let type=document.getElementById("txType").value,sel=document.getElementById("txCategory"),previous=sel.value,cats=activeCats(type);sel.innerHTML=`<option value="">Select category…</option>`+cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");if(cats.some(c=>c.id===previous))sel.value=previous;else{let suggested=categoryFor(document.getElementById("txDetails").value,type);if(suggested)sel.value=suggested}showSubcategories();suggestCategory()}
function suggestCategory(){let d=document.getElementById("txDetails"),type=document.getElementById("txType"),hint=document.getElementById("aiHint"),sel=document.getElementById("txCategory");if(!d||!type||!hint||!sel)return;let id=categoryFor(d.value,type.value),c=categoryObj(id,type.value);if(id){sel.value=id;hint.textContent="Suggested: "+c.name+" — please confirm. This is a learning-rule suggestion, not real AI."}else{hint.textContent="PERLU SEMAK — no matching active category. Please select one manually before saving."}showSubcategories()}
function showSubcategories(){let type=document.getElementById("txType")?.value,cat=categoryObj(document.getElementById("txCategory")?.value,type),sub=document.getElementById("txSub");if(!sub)return;let old=sub.value;sub.innerHTML=`<option value="">— None —</option>`+(cat?.subs||[]).map(s=>`<option>${esc(s)}</option>`).join("");if([...sub.options].some(o=>o.value===old))sub.value=old}
function collectTx(old={}){let type=document.getElementById("txType").value,categoryId=document.getElementById("txCategory").value,cat=categoryObj(categoryId,type);if(!cat||cat.archived){alert("Please select an active category before saving.");return null}let details=document.getElementById("txDetails").value.trim(),amount=Number(document.getElementById("txAmount").value);if(!details||!amount||amount<=0){alert("Please complete description and a valid amount.");return null}return {...old,id:old.id||uid(),date:document.getElementById("txDate").value,type,details,amount,categoryId,categoryName:cat.name,subcategory:document.getElementById("txSub").value||"",receipts:old.receipts||[],updatedAt:new Date().toISOString()}}
function submitTx(e,id,draft){e.preventDefault();let old=id?(draft?state.drafts:state.transactions).find(t=>t.id===id)||{}:{},t=collectTx(old);if(!t)return;rememberRule(t);let role=state.settings.role||"Owner";if(id&&role==="Admin"&&old.status==="posted"){state.proposedChanges.unshift({id:uid(),transactionId:id,proposedBy:state.settings.ownerName||"Admin",values:{date:t.date,type:t.type,details:t.details,amount:t.amount,categoryId:t.categoryId,categoryName:t.categoryName,subcategory:t.subcategory,receipts:t.receipts},status:"pending",createdAt:new Date().toISOString()});log("ADMIN_CHANGE_PROPOSED",id,t.details);document.getElementById("modalBack").classList.remove("show");alert("Change proposal sent to Owner for approval. Original record remains unchanged.");showPage("approvals");return}if(draft){t.status="draft";if(id)state.drafts=state.drafts.filter(x=>x.id!==id);state.drafts.unshift(t);log("DRAFT_SAVED",t.id,t.details);alert("Draft saved. It does not affect reports or balances.");showPage("drafts");return}t.status=role==="Owner"?"posted":"pending";t.createdBy=state.settings.ownerName||role;t.submittedAt=new Date().toISOString();if(id){state.transactions=state.transactions.filter(x=>x.id!==id);log("TRANSACTION_UPDATED",t.id,"Updated transaction")}else log("TRANSACTION_SUBMITTED",t.id,t.details);state.transactions.unshift(t);save();if(document.getElementById("modalBack").classList.contains("show"))document.getElementById("modalBack").classList.remove("show");if(document.getElementById("txFiles").files.length)processSelectedFiles(t.id);else{alert(t.status==="posted"?"Transaction posted successfully.":"Submitted for Owner approval.");showPage(t.status==="posted"?"history":"approvals")}}
function saveAsDraft(id){let old=id?state.drafts.find(x=>x.id===id)||{}:{};let t=collectTx(old);if(!t)return;rememberRule(t);t.status="draft";state.drafts=state.drafts.filter(x=>x.id!==t.id);state.drafts.unshift(t);log("DRAFT_SAVED",t.id,t.details);alert("Draft saved. Not included in balances or reports.");showPage("drafts")}
function processSelectedFiles(txId){let t=state.transactions.find(x=>x.id===txId);if(!t)return;let files=[...document.getElementById("txFiles").files];let done=0;files.forEach(f=>{let r=new FileReader();r.onload=async()=>{let rec={id:uid(),name:f.name,type:f.type,data:r.result,uploadedAt:new Date().toISOString(),ocrText:"",scannedPdf:""};if(f.type.startsWith("image/")&&window.Tesseract){try{let result=await Tesseract.recognize(f,"eng");rec.ocrText=result.data.text||"";}catch(err){rec.ocrText="OCR could not read this image. Please enter details manually."}}t.receipts.push(rec);done++;if(done===files.length){save();let extracted=t.receipts.slice(-done).map(x=>x.ocrText).filter(Boolean).join("\n\n");if(extracted)openModal("Review OCR text",`<div class="notice">OCR is only a suggestion. Check the receipt and manually correct the transaction if needed.</div><textarea rows="12" style="width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px">${esc(extracted)}</textarea><button class="btn primary" onclick="document.getElementById('modalBack').classList.remove('show');showPage('${t.status==="posted"?"history":"approvals"}')">Done</button>`);else showPage(t.status==="posted"?"history":"approvals");}};r.readAsDataURL(f)})}
function historyPage(){return `${header("Transaction History","Posted records, search and monthly summary.")}<div class="panel"><div class="toolbar"><input id="searchTx" placeholder="Search description, category or subcategory" oninput="filterHistory()"><select id="histMonth" onchange="filterHistory()"><option value="">All dates</option>${monthOptions()}</select><select id="typeFilter" onchange="filterHistory()"><option value="">All types</option><option value="in">Cash In</option><option value="out">Cash Out</option></select><select id="catFilter" onchange="filterHistory()"><option value="">All categories</option>${allCategoryNames().map(c=>`<option>${esc(c)}</option>`).join("")}</select></div><div id="historySummary"></div><div id="historyTable">${historyTable(visiblePosted())}</div></div>`}
function monthOptions(){let months=new Set(visiblePosted().map(t=>t.date.slice(0,7)));months.add(monthNow());return [...months].sort().reverse().map(m=>`<option value="${m}" ${m===monthNow()?"selected":""}>${m}</option>`).join("")}
function historyTable(arr){if(!arr.length)return `<div class="empty">No transactions found.</div>`;return `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Category</th><th>Subcategory</th><th>Amount</th><th>Receipts</th><th>Actions</th></tr></thead><tbody>${arr.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<tr><td>${t.date}</td><td><span class="pill ${t.type}">${t.type==="in"?"Cash In":"Cash Out"}</span></td><td>${esc(t.details)}</td><td>${esc(categoryObj(t.categoryId,t.type)?.name||t.categoryName)}</td><td>${esc(t.subcategory||"—")}</td><td class="amount">${money(t.amount)}</td><td>${t.receipts?.length||0}</td><td><div class="actions"><button class="btn sm" onclick="viewTx('${t.id}')">View</button><button class="btn sm" onclick="editTx('${t.id}')">Edit</button><button class="btn sm danger" onclick="softDelete('${t.id}')">Trash</button></div></td></tr>`).join("")}</tbody></table></div>`}
function filterHistory(){let q=(document.getElementById("searchTx")?.value||"").toLowerCase(),m=document.getElementById("histMonth")?.value||"",ty=document.getElementById("typeFilter")?.value||"",c=document.getElementById("catFilter")?.value||"",arr=visiblePosted().filter(t=>(!m||t.date.startsWith(m))&&(!ty||t.type===ty)&&(!c||t.categoryName===c||categoryObj(t.categoryId,t.type)?.name===c)&&(!q||[t.details,t.categoryName,t.subcategory,t.date].join(" ").toLowerCase().includes(q)));let inc=arr.filter(t=>t.type==="in").reduce((s,t)=>s+t.amount,0),out=arr.filter(t=>t.type==="out").reduce((s,t)=>s+t.amount,0);document.getElementById("historySummary").innerHTML=`<div class="cards" style="grid-template-columns:repeat(3,minmax(0,1fr));margin:10px 0"><div class="card metric"><div class="label">Total Cash In</div><div class="value" style="color:var(--good)">${money(inc)}</div></div><div class="card metric"><div class="label">Total Cash Out</div><div class="value" style="color:var(--bad)">${money(out)}</div></div><div class="card metric"><div class="label">Net Difference</div><div class="value">${money(inc-out)}</div></div></div>`;document.getElementById("historyTable").innerHTML=historyTable(arr)}
function viewTx(id){let t=state.transactions.find(x=>x.id===id);if(!t)return;openModal("Transaction details",`<p><b>${esc(t.details)}</b></p><p>${t.date} · ${t.type==="in"?"Cash In":"Cash Out"} · ${money(t.amount)}</p><p>Category: ${esc(categoryObj(t.categoryId,t.type)?.name||t.categoryName)} / ${esc(t.subcategory||"—")}</p><h4>Receipts (${t.receipts?.length||0})</h4>${(t.receipts||[]).map((r,i)=>`<div class="actions" style="margin:8px 0"><span>${esc(r.name)}</span><button class="btn sm" onclick="previewReceipt('${t.id}',${i})">Preview</button><button class="btn sm" onclick="downloadReceipt('${t.id}',${i})">Download</button></div>`).join("")||"No receipts"}`)}
function editTx(id){let t=state.transactions.find(x=>x.id===id);if(!t)return;editingId=id;openModal("Edit transaction",txForm(t,false));setTimeout(()=>{refreshCategoryOptions();document.getElementById("txCategory").value=t.categoryId;showSubcategories();document.getElementById("txSub").value=t.subcategory||""},0)}
function softDelete(id){let t=state.transactions.find(x=>x.id===id);if(!t||!confirm("Move this transaction to Trash?"))return;t.deletedAt=new Date().toISOString();state.trash.unshift(t);state.transactions=state.transactions.filter(x=>x.id!==id);log("TRANSACTION_TRASHED",id,t.details);render()}
function trashPage(){return `${header("Trash","Soft-deleted transactions can be restored.")}<div class="panel">${state.trash.length?historyTable(state.trash.map(t=>({...t,status:"posted"}))):`<div class="empty">Trash is empty.</div>`}</div>`}
function restoreTx(id){let t=state.trash.find(x=>x.id===id);if(!t)return;delete t.deletedAt;state.trash=state.trash.filter(x=>x.id!==id);state.transactions.unshift(t);log("TRANSACTION_RESTORED",id,t.details);render()}
function draftsPage(){return `${header("Drafts","Draft transactions are excluded from reports and balances.")}<div class="panel">${state.drafts.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Details</th><th>Category</th><th>Amount</th><th>Actions</th></tr></thead><tbody>${state.drafts.map(t=>`<tr><td>${t.date}</td><td>${esc(t.details)}</td><td>${esc(t.categoryName)}</td><td>${money(t.amount)}</td><td><button class="btn sm" onclick="editDraft('${t.id}')">Edit</button><button class="btn sm primary" onclick="postDraft('${t.id}')">Post</button><button class="btn sm danger" onclick="deleteDraft('${t.id}')">Delete</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No drafts.</div>`}</div>`}
function editDraft(id){let t=state.drafts.find(x=>x.id===id);if(!t)return;openModal("Edit draft",txForm(t,true));setTimeout(()=>{refreshCategoryOptions();document.getElementById("txCategory").value=t.categoryId;showSubcategories();document.getElementById("txSub").value=t.subcategory||""},0)}
function postDraft(id){let t=state.drafts.find(x=>x.id===id);if(!t)return;if(!confirm("Post this draft as an official Owner transaction?"))return;t.status="posted";state.drafts=state.drafts.filter(x=>x.id!==id);state.transactions.unshift(t);log("DRAFT_POSTED",id,t.details);showPage("history")}
function deleteDraft(id){state.drafts=state.drafts.filter(x=>x.id!==id);log("DRAFT_DELETED",id);render()}
function approvalsPage(){let pending=state.transactions.filter(t=>t.status==="pending"),rejected=state.transactions.filter(t=>t.status==="rejected"),changes=state.proposedChanges.filter(c=>c.status==="pending");return `${header("Approvals","Submissions and proposed changes waiting for Owner review.")}<div class="panel"><h3>New transaction submissions</h3>${pending.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Submitted by</th><th>Details</th><th>Category</th><th>Amount</th><th>Action</th></tr></thead><tbody>${pending.map(t=>`<tr><td>${t.date}</td><td>${esc(t.createdBy)}</td><td>${esc(t.details)}</td><td>${esc(t.categoryName)}</td><td>${money(t.amount)}</td><td><div class="actions"><button class="btn sm primary" onclick="approveTx('${t.id}')">Approve</button><button class="btn sm danger" onclick="rejectTx('${t.id}')">Reject</button></div></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No new transaction submissions.</div>`}<h3 style="margin-top:20px">Rejected submissions</h3>${rejected.length?`<div class="tablewrap"><table><tr><th>Date</th><th>Submitted by</th><th>Details</th><th>Rejection reason</th><th>Action</th></tr>${rejected.map(t=>`<tr><td>${t.date}</td><td>${esc(t.createdBy)}</td><td>${esc(t.details)}</td><td>${esc(t.rejectionReason||"")}</td><td><button class="btn sm" onclick="editTx('${t.id}')">Edit & resubmit</button></td></tr>`).join("")}</table></div>`:`<div class="empty">No rejected submissions.</div>`}<h3 style="margin-top:20px">Proposed changes to posted transactions</h3>${changes.length?`<div class="tablewrap"><table><tr><th>Proposed by</th><th>Record</th><th>Proposed details</th><th>Action</th></tr>${changes.map(c=>`<tr><td>${esc(c.proposedBy)}</td><td>${esc(c.transactionId)}</td><td>${esc(c.values.details)} · ${money(c.values.amount)}</td><td><button class="btn sm primary" onclick="approveChange('${c.id}')">Approve</button> <button class="btn sm danger" onclick="rejectChange('${c.id}')">Reject</button></td></tr>`).join("")}</table></div>`:`<div class="empty">No proposed changes.</div>`}</div>`}
function approveChange(id){let c=state.proposedChanges.find(x=>x.id===id);if(!c)return;let t=state.transactions.find(x=>x.id===c.transactionId);if(!t)return;Object.assign(t,c.values,{status:"posted",approvedChangeAt:new Date().toISOString()});c.status="approved";log("ADMIN_CHANGE_APPROVED",id,t.details);render()}
function rejectChange(id){let c=state.proposedChanges.find(x=>x.id===id);if(!c)return;let reason=prompt("Reason for rejecting proposed change:");if(!reason)return;c.status="rejected";c.reason=reason;log("ADMIN_CHANGE_REJECTED",id,reason);render()}
function approveTx(id){let t=state.transactions.find(x=>x.id===id);if(!t)return;t.status="posted";t.approvedAt=new Date().toISOString();t.approvedBy=state.settings.ownerName||"Owner";log("TRANSACTION_APPROVED",id,t.details);render()}
function rejectTx(id){let t=state.transactions.find(x=>x.id===id);if(!t)return;let reason=prompt("Reason for rejection (required):");if(!reason)return;t.status="rejected";t.rejectionReason=reason;t.rejectedAt=new Date().toISOString();log("TRANSACTION_REJECTED",id,reason);render()}
function categoriesPage(){return `${header("Categories","Manage Cash Out and Cash In categories and subcategories.")}<div class="split"><section class="panel"><div class="pagehead"><div><h3>Cash Out Categories</h3></div><button class="btn primary sm" onclick="addCategory('out')">＋ Add</button></div>${categoryList("out")}</section><section class="panel"><div class="pagehead"><div><h3>Cash In Categories</h3></div><button class="btn primary sm" onclick="addCategory('in')">＋ Add</button></div>${categoryList("in")}</section></div>`}
function categoryList(type){let arr=type==="in"?state.incomeCategories:state.categories;return arr.slice().sort((a,b)=>a.order-b.order).map((c,i)=>`<div class="catitem" style="padding:11px 0;border-bottom:1px solid var(--line)"><div class="catrow"><b class="name">${esc(c.name)}</b>${c.archived?'<span class="pill">Archived</span>':""}<span class="badgecount">${c.subs.length} sub</span></div><div class="smalltext">${c.subs.map(esc).join(" · ")||"No subcategories"}</div><div class="actions" style="margin-top:7px"><button class="btn sm" onclick="editCategory('${type}','${c.id}')">Edit</button><button class="btn sm" onclick="moveCategory('${type}','${c.id}',-1)">↑</button><button class="btn sm" onclick="moveCategory('${type}','${c.id}',1)">↓</button><button class="btn sm" onclick="toggleArchive('${type}','${c.id}')">${c.archived?"Unarchive":"Archive"}</button></div></div>`).join("")}
function addCategory(type){openModal("Add "+(type==="in"?"Cash In":"Cash Out")+" category",`<div class="field"><label>Category name *</label><input id="catName"></div><div class="field"><label>Subcategories (one per line)</label><textarea id="catSubs" rows="4"></textarea></div><button class="btn primary" onclick="saveCategory('${type}')">Save category</button>`)}
function editCategory(type,id){let c=(type==="in"?state.incomeCategories:state.categories).find(x=>x.id===id);openModal("Edit category",`<div class="field"><label>Category name *</label><input id="catName" value="${esc(c.name)}"></div><div class="field"><label>Subcategories (one per line)</label><textarea id="catSubs" rows="4">${esc(c.subs.join("\n"))}</textarea></div><button class="btn primary" onclick="saveCategory('${type}','${id}')">Save changes</button>`)}
function saveCategory(type,id=""){let arr=type==="in"?state.incomeCategories:state.categories,n=document.getElementById("catName").value.trim().toUpperCase(),subs=document.getElementById("catSubs").value.split("\n").map(s=>s.trim()).filter(Boolean);if(!n)return alert("Category name is required.");if(arr.some(c=>c.name.toLowerCase()===n.toLowerCase()&&c.id!==id))return alert("Duplicate category is not allowed.");let c=arr.find(x=>x.id===id);if(c){let old=c.name;c.name=n;c.subs=subs;state.transactions.forEach(t=>{if(t.categoryId===id)t.categoryName=n});log("CATEGORY_UPDATED",id,old+" → "+n)}else{arr.push({id:uid(),name:n,subs,archived:false,order:Math.max(0,...arr.map(c=>c.order))+1});log("CATEGORY_CREATED",n)}save();document.getElementById("modalBack").classList.remove("show");render()}
function toggleArchive(type,id){let c=(type==="in"?state.incomeCategories:state.categories).find(x=>x.id===id);c.archived=!c.archived;log(c.archived?"CATEGORY_ARCHIVED":"CATEGORY_RESTORED",id,c.name);render()}
function moveCategory(type,id,dir){let arr=(type==="in"?state.incomeCategories:state.categories).sort((a,b)=>a.order-b.order),i=arr.findIndex(c=>c.id===id),j=i+dir;if(j<0||j>=arr.length)return;[arr[i].order,arr[j].order]=[arr[j].order,arr[i].order];save();render()}
function reportsPage(){return `${header("Reports","Summary reports with category breakdowns and flexible date ranges.")}<div class="panel"><div class="toolbar"><select id="reportType"><option value="all">All reports</option><option value="in">Income</option><option value="out">Expenses</option><option value="pl">Profit & Loss</option><option value="cash">Cash Flow</option></select><input type="date" id="dateFrom" value="${monthNow()}-01"><input type="date" id="dateTo" value="${today()}"><button class="btn primary" onclick="renderReport()">Generate</button><button class="btn" onclick="exportReportCSV()">CSV</button><button class="btn" onclick="exportReportXLSX()">Excel</button><button class="btn" onclick="exportReportPDF()">PDF</button><button class="btn" onclick="window.print()">Print</button></div><div id="reportResult">${reportSummary("all",monthNow()+"-01",today())}</div></div>`}
function reportSummary(type,from,to){let arr=visiblePosted().filter(t=>t.date>=from&&t.date<=to);if(type==="in"||type==="out")arr=arr.filter(t=>t.type===type);let inc=arr.filter(t=>t.type==="in").reduce((s,t)=>s+t.amount,0),out=arr.filter(t=>t.type==="out").reduce((s,t)=>s+t.amount,0),by={};arr.filter(t=>t.type==="out").forEach(t=>{let n=categoryObj(t.categoryId,"out")?.name||t.categoryName;by[n]=(by[n]||0)+t.amount});return `<div class="cards" style="grid-template-columns:repeat(3,minmax(0,1fr))">${metric("Cash In",money(inc),"↗","Selected period")}${metric("Cash Out",money(out),"↘","Selected period")}${metric("Net",money(inc-out),"＝","Cash In − Cash Out")}</div><p class="smalltext">Period: ${from} to ${to} · Opening balance is excluded from income and Profit & Loss.</p><h3>Expense breakdown</h3>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="barrow"><div class="barlabel"><span>${esc(n)}</span><b>${money(v)}</b></div></div>`).join("")||"No expenses in this period."}`}
function renderReport(){let from=document.getElementById("dateFrom").value,to=document.getElementById("dateTo").value;if(!from||!to||from>to)return alert("Please choose a valid date range.");document.getElementById("reportResult").innerHTML=reportSummary(document.getElementById("reportType").value,from,to)}
function exportReportCSV(){let from=document.getElementById("dateFrom").value,to=document.getElementById("dateTo").value,arr=visiblePosted().filter(t=>t.date>=from&&t.date<=to),rows=[["Period",from,to],["Type","Category","Subcategory","Amount"],...arr.map(t=>[t.type,t.categoryName,t.subcategory,t.amount])];download(new Blob(["\uFEFF"+rows.map(r=>r.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}),"RPD_Report_"+from+"_to_"+to+".csv")}
function exportReportXLSX(){if(!window.XLSX)return alert("Excel export library unavailable. Use CSV instead.");let from=document.getElementById("dateFrom").value,to=document.getElementById("dateTo").value,arr=visiblePosted().filter(t=>t.date>=from&&t.date<=to),rows=arr.map(t=>({Date:t.date,Type:t.type==="in"?"Cash In":"Cash Out",Description:t.details,Category:t.categoryName,Subcategory:t.subcategory||"",Amount_RM:Number(t.amount)}));let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Transactions");XLSX.writeFile(wb,"RPD_Report_"+from+"_to_"+to+".xlsx");}
function exportReportPDF(){if(!window.jspdf)return alert("PDF library unavailable. Check internet connection.");let from=document.getElementById("dateFrom").value,to=document.getElementById("dateTo").value,arr=visiblePosted().filter(t=>t.date>=from&&t.date<=to),inc=arr.filter(t=>t.type==="in").reduce((s,t)=>s+t.amount,0),out=arr.filter(t=>t.type==="out").reduce((s,t)=>s+t.amount,0),doc=new jspdf.jsPDF();doc.setFontSize(16);doc.text("Rumah Penjagaan Damai",14,18);doc.setFontSize(10);doc.text("RPD Bookkeeping · "+from+" to "+to,14,26);doc.text("Cash In: "+money(inc)+" | Cash Out: "+money(out)+" | Net: "+money(inc-out),14,36);let y=50;let groups={};arr.filter(t=>t.type==="out").forEach(t=>{let n=t.categoryName||"Other";groups[n]=(groups[n]||0)+t.amount});Object.entries(groups).sort((a,b)=>b[1]-a[1]).forEach(([n,v])=>{doc.text(n+": "+money(v),14,y);y+=7;if(y>280){doc.addPage();y=18}});doc.save("RPD_Report_"+from+"_to_"+to+".pdf")}
function trashPage(){return `${header("Trash","Restore soft-deleted transactions. They are excluded from all financial totals.")}<div class="panel">${state.trash.length?`<div class="tablewrap"><table><tr><th>Date</th><th>Description</th><th>Amount</th><th>Action</th></tr>${state.trash.map(t=>`<tr><td>${t.date}</td><td>${esc(t.details)}</td><td>${money(t.amount)}</td><td><button class="btn sm primary" onclick="restoreTx('${t.id}')">Restore</button></td></tr>`).join("")}</table></div>`:`<div class="empty">Trash is empty.</div>`}</div>`}
function restoreTx(id){let t=state.trash.find(x=>x.id===id);if(!t)return;state.trash=state.trash.filter(x=>x.id!==id);delete t.deletedAt;state.transactions.unshift(t);log("TRANSACTION_RESTORED",id,t.details);render()}
function auditPage(){return `${header("Audit Trail","Protected activity history. Corrections are recorded rather than erasing history.")}<div class="panel"><div class="tablewrap"><table><tr><th>Date / Time</th><th>User</th><th>Action</th><th>Record</th><th>Details</th></tr>${state.audit.map(a=>`<tr><td>${new Date(a.at).toLocaleString("en-MY")}</td><td>${esc(a.user)}</td><td>${esc(a.action)}</td><td>${esc(a.record)}</td><td>${esc(a.details)}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">No activity yet.</td></tr>`}</table></div></div>`}
function settingsPage(){return `${header("Settings","Profile, app preferences, opening balances and technical connection.")}<div class="split"><section class="panel"><h3>Profile & appearance</h3><div class="field"><label>Display name</label><input id="ownerName" value="${esc(state.settings.ownerName||"Owner")}"></div><div class="field"><label>Role (prototype preview)</label><select id="role"><option ${state.settings.role==="Owner"?"selected":""}>Owner</option><option ${state.settings.role==="Admin"?"selected":""}>Admin</option><option ${state.settings.role==="Staff"?"selected":""}>Staff</option><option ${state.settings.role==="Viewer"?"selected":""}>Viewer</option></select></div><div class="field"><label>Theme</label><select id="theme"><option value="light" ${state.settings.theme!=="dark"?"selected":""}>Light</option><option value="dark" ${state.settings.theme==="dark"?"selected":""}>Dark</option></select></div><button class="btn primary" onclick="saveSettings()">Save preferences</button><div class="notice warn">Role selector is a local prototype preview only. It is NOT secure authentication or access control.</div></section><section class="panel"><h3>Monthly opening bank balance</h3><div class="field"><label>Month</label><input id="openingMonth" type="month" value="${monthNow()}"></div><div class="field"><label>Opening balance (RM)</label><input id="openingAmount" type="number" step="0.01" value="${openingFor(monthNow())}"></div><button class="btn primary" onclick="saveOpening()">Save opening balance</button><div class="notice">Opening balance carries forward from the previous month's closing balance unless manually adjusted. It is not revenue.</div></section></div>
<div class="panel"><h3>Storage & cloud connection</h3><div class="notice warn"><b>Current mode: Local browser storage.</b> Data stays in this browser/device and does not sync to other users or devices. Supabase is not connected yet.</div><div class="field"><label>Supabase Project URL</label><input id="sbUrl" placeholder="https://your-project.supabase.co" value="${esc(localStorage.getItem("rpd_sb_url")||"")}"></div><div class="field"><label>Supabase anon / publishable key</label><input id="sbKey" placeholder="Public anon key" value="${esc(localStorage.getItem("rpd_sb_key")||"")}"></div><button class="btn" onclick="saveSupabaseConfig()">Save connection settings</button><p class="smalltext">Saving credentials here does not complete database setup. A Supabase schema, authentication policies, storage bucket and secure deployment steps are still required. Never enter a service-role secret key here.</p><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><div class="actions"><button class="btn" onclick="exportBackup()">Download full JSON backup</button><button class="btn" onclick="document.getElementById('restoreFile').click()">Restore JSON backup</button><input id="restoreFile" type="file" accept="application/json" hidden onchange="restoreBackup(event)"></div></div>
<div class="panel"><h3>Receipt retention</h3><p>Selected retention: <b>${state.settings.retentionYears||5} years</b>. Confirm the applicable business/tax record retention period with your accountant before production use.</p><p class="smalltext">OCR is performed in-browser using Tesseract.js when available. Extracted text must be reviewed; OCR does not post receipt values automatically.</p></div>`}
function saveSettings(){state.settings.ownerName=document.getElementById("ownerName").value.trim()||"Owner";state.settings.role=document.getElementById("role").value;state.settings.theme=document.getElementById("theme").value;document.documentElement.dataset.theme=state.settings.theme;save();log("PROFILE_SETTINGS_UPDATED","profile");alert("Preferences saved.")}
function saveOpening(){let m=document.getElementById("openingMonth").value,v=Number(document.getElementById("openingAmount").value);if(!m||!Number.isFinite(v))return alert("Enter a month and opening balance.");state.openingBalances[m]=v;log("OPENING_BALANCE_ADJUSTED",m,money(v));alert("Opening balance saved.");render()}
function saveSupabaseConfig(){localStorage.setItem("rpd_sb_url",document.getElementById("sbUrl").value.trim());localStorage.setItem("rpd_sb_key",document.getElementById("sbKey").value.trim());alert("Connection details saved locally. Database connection is not active until Supabase setup is completed.");}
function exportBackup(){download(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),"RPD_Full_Backup_"+today()+".json")}
function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let s=JSON.parse(r.result);if(!s.transactions||!s.categories)throw Error();if(!confirm("Replace current local data with this backup? Download a backup first."))return;state=s;save();log("BACKUP_RESTORED","full backup");alert("Backup restored.");render()}catch(err){alert("Invalid RPD backup file.")}};r.readAsText(f)}
function previewReceipt(id,i){let t=state.transactions.find(x=>x.id===id),r=t?.receipts?.[i];if(!r)return;openModal("Receipt preview",r.type==="application/pdf"?`<p>PDF receipt: ${esc(r.name)}</p><a href="${r.data}" target="_blank">Open PDF</a>`:`<img src="${r.data}" style="max-width:100%;max-height:70vh;display:block;margin:auto"><div class="actions" style="margin-top:12px"><button class="btn" onclick="downloadReceiptPDF('${id}',${i})">Create PDF copy</button><button class="btn" onclick="downloadReceipt('${id}',${i})">Download original</button></div>`)}
function downloadReceiptPDF(id,i){let t=state.transactions.find(x=>x.id===id),r=t?.receipts?.[i];if(!r||!window.jspdf)return alert("PDF library unavailable.");let doc=new jspdf.jsPDF();let img=new Image();img.onload=()=>{let canvas=document.createElement("canvas");canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;canvas.getContext("2d").drawImage(img,0,0);let data=canvas.toDataURL("image/jpeg",0.92);let w=190,h=img.height*w/img.width;if(h>270){h=270;w=img.width*h/img.height}doc.addImage(data,"JPEG",10,10,w,h);doc.save((r.name||"receipt").replace(/\.[^.]+$/,"")+"_scanned-copy.pdf")};img.onerror=()=>alert("Could not convert this image. Download the original instead.");img.src=r.data}
function downloadReceipt(id,i){let t=state.transactions.find(x=>x.id===id),r=t?.receipts?.[i];if(!r)return;let a=document.createElement("a");a.href=r.data;a.download=r.name;a.click()}
function previewExistingReceipt(id,i){previewReceipt(id,i)}
function openModal(title,body){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;document.getElementById("modalBack").classList.add("show")}
document.getElementById("modalClose").onclick=()=>document.getElementById("modalBack").classList.remove("show");document.getElementById("modalBack").onclick=e=>{if(e.target.id==="modalBack")e.currentTarget.classList.remove("show")};
function render(){let m=document.getElementById("main");let pages={dashboard:dashboard,add:addPage,history:historyPage,approvals:approvalsPage,drafts:draftsPage,categories:categoriesPage,rules:rulesPage,reports:reportsPage,trash:trashPage,audit:auditPage,settings:settingsPage};m.innerHTML=(pages[page]||dashboard)();updateCounts();if(page==="history")filterHistory()}
document.getElementById("themeBtn").onclick=()=>{state.settings.theme=state.settings.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=state.settings.theme;save()};
document.getElementById("backupBtn").onclick=exportBackup;
function download(blob,name){let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
document.documentElement.dataset.theme=state.settings.theme||"light";
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e});
if("serviceWorker"in navigator&&location.protocol!=="file:")window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(console.warn));
render();
</script>
</body></html>
